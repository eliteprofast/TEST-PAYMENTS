<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060d;
      --card-bg: #0f1a33;
      --card-border: rgba(126, 166, 255, 0.18);
      --heading: #f5e663;
      --text: #9cc0f5;
      --accent-strong: #3b6fe0;
      --danger: #ff7b72;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 90% 55% at 50% 105%, rgba(46, 78, 178, 0.55), transparent 70%),
        radial-gradient(ellipse 70% 45% at 15% 0%, rgba(58, 43, 130, 0.35), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 60px rgba(46, 78, 178, 0.15);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 26px;
      font-weight: 700;
      color: var(--danger);
      letter-spacing: 0.5px;
    }

    p {
      margin: 0 0 28px;
      font-size: 15px;
      font-weight: 500;
    }

    a {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #5b96ff, var(--accent-strong));
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    a:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(76, 141, 255, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Payment Failed</h1>
    <p>Please try again.</p>
    <a id="return-link" href="/">Return to checkout</a>
  </div>
  <script>
    // If this payment started from an ElitezShop cart handoff, send the
    // shopper back to their cart (still intact — nothing was captured) rather
    // than this standalone test form.
    const returnUrl = sessionStorage.getItem("elitez_return_url");
    if (returnUrl) {
      try {
        const url = new URL(returnUrl);
        const link = document.getElementById("return-link");
        link.href = url.toString();
        link.textContent = "Return to ElitezShop";
      } catch {
        // Malformed value — keep the default "Return to checkout" link.
      }
    }
  </script>
</body>
</html>
